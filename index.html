    /* =========================================

    function App() {

      const [opening, setOpening] =
        useState(true);

      const [showInvitation, setShowInvitation] =
        useState(false);

      const [isPlaying, setIsPlaying] =
        useState(false);


      const audioRef =
        useRef(null);

      const videoRef =
        useRef(null);

      const musicWasPlayingRef =
        useRef(false);


      /* =========================================
         AUDIO ERROR CHECK
      ========================================= */

      useEffect(() => {

        const audio =
          audioRef.current;

        if (!audio) {
          return;
        }

        const handleCanPlay = () => {
          console.log("Wedding music loaded successfully.");
        };

        const handleError = () => {
          console.error(
            "ERROR: Wedding music could not be loaded."
          );

          console.error(
            "Make sure public/Trimmed.mp3 exists."
          );
        };

        audio.addEventListener(
          "canplaythrough",
          handleCanPlay
        );

        audio.addEventListener(
          "error",
          handleError
        );

        return () => {

          audio.removeEventListener(
            "canplaythrough",
            handleCanPlay
          );

          audio.removeEventListener(
            "error",
            handleError
          );

        };

      }, []);


      /* =========================================
         OPEN INVITATION
      ========================================= */

      const openInvitation = async () => {

        /*
         * IMPORTANT:
         * This function is directly called by
         * the user's button click.
         *
         * Therefore the browser allows audio
         * playback here.
         */

        try {

          const audio =
            audioRef.current;

          if (audio) {

            audio.currentTime = 0;

            audio.volume = 1;

            await audio.play();

            setIsPlaying(true);

            console.log(
              "Wedding music started."
            );

          }

        } catch (error) {

          console.error(
            "Music playback error:",
            error
          );

          setIsPlaying(false);

        }


        /*
         * Close opening screen
         */

        setOpening(false);


        setTimeout(() => {

          setShowInvitation(true);

        }, 500);

      };


      /* =========================================
         MUSIC BUTTON
      ========================================= */

      const toggleMusic = async (event) => {

        event.stopPropagation();

        const audio =
          audioRef.current;

        if (!audio) {
          return;
        }


        /*
         * Do not start music while video
         * is playing.
         */

        if (
          videoRef.current &&
          !videoRef.current.paused &&
          !videoRef.current.ended
        ) {

          return;

        }


        try {

          if (audio.paused) {

            await audio.play();

            setIsPlaying(true);

          } else {

            audio.pause();

            setIsPlaying(false);

          }

        } catch (error) {

          console.error(
            "Music could not be played:",
            error
          );

          setIsPlaying(false);

        }

      };


      /* =========================================
         VIDEO PLAY
      ========================================= */

      const handleVideoPlay = () => {

        const audio =
          audioRef.current;

        if (!audio) {
          return;
        }


        /*
         * Remember whether music was playing
         * before video started.
         */

        musicWasPlayingRef.current =
          !audio.paused;


        /*
         * Stop background music.
         */

        audio.pause();

        setIsPlaying(false);

      };


      /* =========================================
         VIDEO PAUSE
      ========================================= */

      const handleVideoPause = () => {

        /*
         * Music does NOT automatically start
         * when video is paused.
         */

      };


      /* =========================================
         VIDEO END
      ========================================= */

      const handleVideoEnded = async () => {

        const audio =
          audioRef.current;


        /*
         * Resume music only when it was playing
         * before the video started.
         */

        if (
          musicWasPlayingRef.current &&
          audio
        ) {

          try {

            await audio.play();

            setIsPlaying(true);

          } catch (error) {

            console.error(
              "Music resume failed:",
              error
            );

            setIsPlaying(false);

          }

        }


        musicWasPlayingRef.current =
          false;

      };


      /* =========================================
         TAB CHANGE / BACKGROUND
      ========================================= */

      useEffect(() => {

        const handleVisibilityChange = () => {

          if (document.hidden) {

            /*
             * Pause background music
             */

            if (audioRef.current) {

              audioRef.current.pause();

              setIsPlaying(false);

            }


            /*
             * Pause video
             */

            if (videoRef.current) {

              videoRef.current.pause();

            }

          }

        };


        document.addEventListener(
          "visibilitychange",
          handleVisibilityChange
        );


        return () => {

          document.removeEventListener(
            "visibilitychange",
            handleVisibilityChange
          );

        };

      }, []);

    /* =========================================
       FLOWER CANVAS
    ========================================= */

    function FlowerCanvas() {

      const canvasRef =
        useRef(null);


      useEffect(() => {

        const canvas =
          canvasRef.current;

        if (!canvas) {
          return;
        }


        const ctx =
          canvas.getContext("2d");


        let animationId;


        const resize = () => {

          canvas.width =
            window.innerWidth;

          canvas.height =
            window.innerHeight;

        };


        resize();


        window.addEventListener(
          "resize",
          resize
        );


        const petals =
          Array.from(
            { length: 30 },
            () => ({

              x:
                Math.random() *
                canvas.width,

              y:
                Math.random() *
                canvas.height -
                canvas.height,

              r:
                Math.random() * 5 + 3,

              speedY:
                Math.random() * 1 + 1,

              speedX:
                Math.random() * 1 - .5,

              color:
                Math.random() > .5
                  ? "#d4af37"
                  : "#f4c430"

            })
          );


        function draw() {

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          petals.forEach(p => {

            ctx.beginPath();

            ctx.fillStyle =
              p.color;

            ctx.globalAlpha =
              .6;


            ctx.arc(
              p.x,
              p.y,
              p.r,
              0,
              Math.PI * 2
            );


            ctx.fill();


            p.y +=
              p.speedY;

            p.x +=
              p.speedX;


            if (
              p.y >
              canvas.height
            ) {

              p.y = -10;

              p.x =
                Math.random() *
                canvas.width;

            }

          });


          ctx.globalAlpha = 1;


          animationId =
            requestAnimationFrame(draw);

        }


        draw();


        return () => {

          cancelAnimationFrame(
            animationId
          );

          window.removeEventListener(
            "resize",
            resize
          );

        };

      }, []);


      return (

        <canvas
          ref={canvasRef}
          className="
            fixed
            inset-0
            pointer-events-none
            z-30
          "
        />

      );

    }


    /* =========================================
       HERO
    ========================================= */

    function HeroSection() {

      const [timeLeft, setTimeLeft] =
        useState({

          days: 0,
          hours: 0,
          minutes: 0,
          seconds: 0

        });


      useEffect(() => {

        const target =
          new Date(
            WEDDING_DATA.weddingDate
          ).getTime();


        const updateCountdown = () => {

          const difference =
            target -
            new Date().getTime();


          if (difference <= 0) {

            setTimeLeft({
              days: 0,
              hours: 0,
              minutes: 0,
              seconds: 0
            });

            return;

          }


          setTimeLeft({

            days:
              Math.floor(
                difference /
                (
                  1000 *
                  60 *
                  60 *
                  24
                )
              ),

            hours:
              Math.floor(
                (
                  difference %
                  (
                    1000 *
                    60 *
                    60 *
                    24
                  )
                ) /
                (
                  1000 *
                  60 *
                  60

              ),

            minutes:

                    1000 *
                    60 *
                    60
                  )
                ) /
                (
                  1000 *
                  60
                )
              ),

            seconds:
              Math.floor(
                (
                  difference %
                  (
                    1000 *
                    60
                  )
                ) /
                1000
              )

          });

        };


        updateCountdown();


        const interval =
          setInterval(
            updateCountdown,
            1000
          );


        return () =>
          clearInterval(interval);

      }, []);
